<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Stem Reference Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Stem Reference Studio</h1>
      <p>DAWライクなstem管理・リファレンス研究MVP</p>
    </header>

    <main class="layout">
      <section class="panel library">
        <h2>曲ライブラリ</h2>
        <form id="song-form" class="grid-form">
          <input id="song-title" placeholder="曲タイトル" required />
          <input id="song-artist" placeholder="アーティスト" required />
          <input id="song-bpm" type="number" min="40" max="260" placeholder="BPM" required />
          <button type="submit">曲を追加</button>
        </form>

        <div class="filter-row">
          <input id="song-search" placeholder="曲名・アーティスト検索" />
        </div>

        <div id="song-list"></div>
        <div class="pagination">
          <button id="prev-page">前へ</button>
          <span id="page-indicator"></span>
          <button id="next-page">次へ</button>
        </div>
      </section>

      <section class="panel editor">
        <h2>曲詳細（DAWライク）</h2>
        <div id="song-detail-empty">左のライブラリから曲を選択してください。</div>
        <div id="song-detail" class="hidden">
          <div class="transport">
            <button id="play-btn">▶︎ 再生</button>
            <button id="stop-btn">■ 停止</button>
            <span id="play-status">停止中</span>
          </div>

          <div class="daw-grid">
            <div>
              <h3>セクションマーカー</h3>
              <form id="marker-form" class="inline-form">
                <input id="marker-name" placeholder="Intro/Verse/Chorus" required />
                <input id="marker-start" type="number" min="1" placeholder="開始小節" required />
                <input id="marker-end" type="number" min="1" placeholder="終了小節" required />
                <button type="submit">追加</button>
              </form>
              <ul id="marker-list"></ul>
            </div>

            <div>
              <h3>マルチトラック（stem）</h3>
              <form id="track-form" class="inline-form">
                <input id="track-name" placeholder="drums / bass / vocal" required />
                <input id="track-note" placeholder="トラックメモ" />
                <input id="track-file" type="file" accept="audio/*" />
                <button type="submit">追加</button>
              </form>
              <div id="track-list"></div>
            </div>
          </div>

          <div class="meta-row">
            <label>BPM <input id="detail-bpm" type="number" min="40" max="260" /></label>
            <label>曲メモ <input id="song-note" placeholder="曲全体メモ" /></label>
            <button id="save-song-meta">保存</button>
          </div>

          <h3>小節ごとのコード進行</h3>
          <p class="help">例: <code>1:C 2:G/B 3:Am7 4:F</code></p>
          <textarea id="chord-input" rows="3"></textarea>
          <button id="save-chords">コード保存</button>
        </div>
      </section>

      <section class="panel stats">
        <h2>検索・統計</h2>
        <div class="grid-form search-grid">
          <input id="search-keyword" placeholder="メモ/曲情報キーワード" />
          <input id="search-chord" placeholder="コード (例: Am7)" />
          <input id="search-bpm-min" type="number" placeholder="BPM min" />
          <input id="search-bpm-max" type="number" placeholder="BPM max" />
          <button id="run-search" type="button">検索</button>
        </div>
        <ul id="search-result"></ul>

        <h3>統計</h3>
        <div id="stats-box"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
